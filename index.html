<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Smartly Admin | Storefront management</title>
<style>
:root{--navy:#123B5D;--teal:#159A9C;--red:#D94A45;--muted:#68727d;--line:#e4e7ea}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f4f7f9;color:#17212b}
header{background:var(--navy);color:#fff;padding:16px 24px;display:flex;justify-content:space-between;align-items:center}
header h1{margin:0;font-size:20px;font-weight:800}
header small{display:block;font-size:12px;color:#a0b0c0;font-weight:400}
.btn-signout{background:var(--teal);color:#fff;border:0;padding:8px 16px;border-radius:6px;font-weight:bold;cursor:pointer}
.container{max-width:1200px;margin:24px auto;padding:0 16px}
.nav-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
.tab-btn{background:#fff;border:1px solid var(--line);padding:9px 15px;border-radius:8px;cursor:pointer;font-weight:600;color:#45515c}
.tab-btn.active{background:var(--navy);color:#fff;border-color:var(--navy)}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:24px;margin-bottom:24px;box-shadow:0 4px 12px rgba(0,0,0,.03)}
.card h2{margin-top:0;font-size:22px;color:var(--navy)}
.form-grid{display:grid;grid-template-columns:repeat(3, 1fr);gap:16px;margin-bottom:20px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12px;font-weight:bold;color:#45515c}
.field input, .field select, .field textarea{padding:10px;border:1px solid var(--line);border-radius:6px;font-size:14px}
.btn-group{display:flex;gap:10px}
.btn-primary{background:var(--teal);color:#fff;border:0;padding:10px 18px;border-radius:6px;font-weight:bold;cursor:pointer}
.btn-secondary{background:#e4e7ea;color:#17212b;border:0;padding:10px 18px;border-radius:6px;font-weight:bold;cursor:pointer}
.btn-danger{background:var(--red);color:#fff;border:0;padding:6px 12px;border-radius:6px;font-weight:bold;cursor:pointer}
table{width:100%;border-collapse:collapse;margin-top:10px}
th, td{text-align:left;padding:12px;border-bottom:1px solid var(--line);font-size:14px}
th{color:var(--muted);font-size:12px;text-transform:uppercase}
.toast{position:fixed;bottom:20px;left:50%;transform:translate(-50%,120px);background:var(--navy);color:#fff;padding:12px 20px;border-radius:999px;transition:.25s;z-index:200}
.toast.show{transform:translate(-50%,0)}
</style>
</head>
<body>

<header>
  <div>
    <h1>Smartly Admin</h1>
    <small>Storefront management</small>
  </div>
  <button class="btn-signout" onclick="logout()">Sign out</button>
</header>

<div class="container">
  <div class="nav-tabs">
    <button class="tab-btn">Dashboard</button>
    <button class="tab-btn">Orders</button>
    <button class="tab-btn active">Products</button>
    <button class="tab-btn">Categories</button>
    <button class="tab-btn">Countries</button>
    <button class="tab-btn">Bundles & Offers</button>
    <button class="tab-btn">Natural Products</button>
    <button class="tab-btn">Payment Methods</button>
    <button class="tab-btn">Reservations</button>
    <button class="tab-btn">Reviews</button>
    <button class="tab-btn">Special Requests</button>
    <button class="tab-btn">Customers</button>
    <button class="tab-btn">Settings</button>
  </div>

  <div class="card">
    <h2>Products</h2>
    <form id="productForm" onsubmit="saveProduct(event)">
      <div class="form-grid">
        <div class="field"><label>Name EN</label><input type="text" id="p_name_en" required></div>
        <div class="field"><label>Name AR</label><input type="text" id="p_name_ar"></div>
        <div class="field"><label>Category</label><select id="p_category"><option value="">Select category</option></select></div>
        <div class="field"><label>Description EN</label><input type="text" id="p_desc_en"></div>
        <div class="field"><label>Description AR</label><input type="text" id="p_desc_ar"></div>
        <div class="field"><label>Retail Price</label><input type="number" step="0.01" id="p_price" required></div>
        <div class="field"><label>Stock Quantity</label><input type="number" id="p_stock" value="0"></div>
        <div class="field"><label>Sort Order</label><input type="number" id="p_sort" value="0"></div>
        <div class="field"><label>Image</label><input type="file" id="p_image" accept="image/*"></div>
        <div class="field">
          <label>Active</label>
          <select id="p_active"><option value="true">Yes</option><option value="false">No</option></select>
        </div>
        <div class="field">
          <label>Natural Product</label>
          <select id="p_natural"><option value="false">No</option><option value="true">Yes</option></select>
        </div>
      </div>
      <div class="btn-group">
        <button type="submit" class="btn-primary">Save Product</button>
        <button type="button" class="btn-secondary" onclick="document.getElementById('productForm').reset()">Refresh</button>
      </div>
    </form>
  </div>

  <div class="card">
    <table>
      <thead>
        <tr>
          <th>Product</th>
          <th>Category</th>
          <th>Price</th>
          <th>Stock</th>
          <th>Natural</th>
          <th>Active</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody id="productTableBody"></tbody>
    </table>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://nqwsowkcazkfpqmwmsqw.supabase.co";
const SUPABASE_KEY = "sb_publishable_liFbnyZgnxTgNc2cBHuW8w_oLyoFFqO";
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let products = [], categories = [];

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2400);
}

async function loadData(){
  const [pRes, cRes] = await Promise.all([
    sb.from('products').select('*').order('sort_order'),
    sb.from('categories').select('*').order('sort_order')
  ]);
  products = pRes.data || [];
  categories = cRes.data || [];
  
  const catSelect = document.getElementById('p_category');
  catSelect.innerHTML = '<option value="">Select category</option>' + categories.map(c => `<option value="${c.id}">${c.name_en || c.name}</option>`).join('');

  renderTable();
}

function renderTable(){
  const tbody = document.getElementById('productTableBody');
  tbody.innerHTML = products.map(p => `
    <tr>
      <td><b>${p.name_en || p.name_ar || 'Untitled'}</b></td>
      <td>${p.category_id || '-'}</td>
      <td>$${Number(p.retail_price||0).toFixed(2)}</td>
      <td>${Number(p.stock_quantity||0)}</td>
      <td>${p.is_natural ? 'Yes' : 'No'}</td>
      <td>${p.active !== false ? 'Yes' : 'No'}</td>
      <td><button class="btn-danger" onclick="deleteProduct('${p.id}')">Delete</button></td>
    </tr>
  `).join('');
}

async function saveProduct(e){
  e.preventDefault();
  const payload = {
    name_en: document.getElementById('p_name_en').value,
    name_ar: document.getElementById('p_name_ar').value,
    category_id: document.getElementById('p_category').value || null,
    description_en: document.getElementById('p_desc_en').value,
    description_ar: document.getElementById('p_desc_ar').value,
    retail_price: parseFloat(document.getElementById('p_price').value) || 0,
    stock_quantity: parseInt(document.getElementById('p_stock').value) || 0,
    sort_order: parseInt(document.getElementById('p_sort').value) || 0,
    active: document.getElementById('p_active').value === 'true',
    is_natural: document.getElementById('p_natural').value === 'true'
  };

  const { error } = await sb.from('products').insert([payload]);
  if(error) return toast(error.message);

  toast('Product saved!');
  document.getElementById('productForm').reset();
  loadData();
}

async function deleteProduct(id){
  if(!confirm('Delete this product?')) return;
  const { error } = await sb.from('products').delete().eq('id', id);
  if(error) return toast(error.message);
  toast('Product deleted');
  loadData();
}

function logout(){
  sb.auth.signOut().then(() => window.location.href = '/');
}

loadData();
</script>
</body>
</html>
