<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Smartly Admin | Storefront Management</title>
<style>
:root{--navy:#123B5D;--blue:#1E6FA8;--teal:#159A9C;--red:#D94A45;--gold:#E6A83B;--cream:#F7F5EF;--white:#fff;--ink:#17212b;--muted:#68727d;--line:#e4e7ea;--shadow:0 12px 35px rgba(18,59,93,.10)}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f4f7f9;color:var(--ink)}
header{background:var(--navy);color:#fff;padding:16px 24px;display:flex;justify-content:space-between;align-items:center}
header h1{margin:0;font-size:20px;font-weight:800}
header small{display:block;font-size:12px;color:#a0b0c0;font-weight:400}
.btn-signout{background:var(--teal);color:#fff;border:0;padding:8px 16px;border-radius:6px;font-weight:bold;cursor:pointer}
.container{max-width:1200px;margin:24px auto;padding:0 16px}
.nav-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
.tab-btn{background:#fff;border:1px solid var(--line);padding:9px 15px;border-radius:8px;cursor:pointer;font-weight:600;color:#45515c}
.tab-btn.active{background:var(--navy);color:#fff;border-color:var(--navy)}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:24px;margin-bottom:24px;box-shadow:0 4px 12px rgba(0,0,0,.03)}
.card h2{margin-top:0;font-size:22px;color:var(--navy)}
.form-grid{display:grid;grid-template-columns:repeat(3, 1fr);gap:16px;margin-bottom:20px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12px;font-weight:bold;color:#45515c}
.field input, .field select, .field textarea{padding:10px;border:1px solid var(--line);border-radius:6px;font-size:14px}
.field textarea{resize:vertical;min-height:38px}
.btn-group{display:flex;gap:10px}
.btn-primary{background:var(--teal);color:#fff;border:0;padding:10px 18px;border-radius:6px;font-weight:bold;cursor:pointer}
.btn-secondary{background:#e4e7ea;color:#17212b;border:0;padding:10px 18px;border-radius:6px;font-weight:bold;cursor:pointer}
.btn-danger{background:var(--red);color:#fff;border:0;padding:6px 12px;border-radius:6px;font-weight:bold;cursor:pointer}
table{width:100%;border-collapse:collapse;margin-top:10px}
th, td{text-align:left;padding:12px;border-bottom:1px solid var(--line);font-size:14px}
th{color:var(--muted);font-size:12px;text-transform:uppercase}
.toast{position:fixed;bottom:20px;left:50%;transform:translate(-50%,120px);background:var(--navy);color:#fff;padding:12px 20px;border-radius:999px;transition:.25s;z-index:200}
.toast.show{transform:translate(-50%,0)}
@media(max-width:800px){.form-grid{grid-template-columns:1fr}}
</style>
</head>
<body>

<header>
  <div>
    <h1>Smartly Admin</h1>
    <small>Storefront management</small>
  </div>
  <button class="btn-signout" onclick="logout()">Sign out</button>
</header>

<div class="container">
  <div class="nav-tabs" id="tabs">
    <button class="tab-btn" onclick="switchTab('dashboard')">Dashboard</button>
    <button class="tab-btn" onclick="switchTab('orders')">Orders</button>
    <button class="tab-btn active" onclick="switchTab('products')">Products</button>
    <button class="tab-btn" onclick="switchTab('categories')">Categories</button>
    <button class="tab-btn" onclick="switchTab('countries')">Countries</button>
    <button class="tab-btn" onclick="switchTab('bundles')">Bundles & Offers</button>
    <button class="tab-btn" onclick="switchTab('natural')">Natural Products</button>
    <button class="tab-btn" onclick="switchTab('payments')">Payment Methods</button>
    <button class="tab-btn" onclick="switchTab('reservations')">Reservations</button>
    <button class="tab-btn" onclick="switchTab('reviews')">Reviews</button>
    <button class="tab-btn" onclick="switchTab('special')">Special Requests</button>
    <button class="tab-btn" onclick="switchTab('customers')">Customers</button>
    <button class="tab-btn" onclick="switchTab('settings')">Settings</button>
  </div>

  <div id="tab-content"></div>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://nqwsowkcazkfpqmwmsqw.supabase.co";
const SUPABASE_KEY = "sb_publishable_liFbnyZgnxTgNc2cBHuW8w_oLyoFFqO";
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let currentTab = 'products';
let products = [], categories = [];

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2400);
}

function esc(str){
  return String(str??'').replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
}

async function init(){
  const [pRes, cRes] = await Promise.all([
    sb.from('products').select('*').order('sort_order'),
    sb.from('categories').select('*').order('sort_order')
  ]);
  products = pRes.data || [];
  categories = cRes.data || [];
  renderTab();
}

function switchTab(tab){
  currentTab = tab;
  document.querySelectorAll('.tab-btn').forEach(b => {
    b.classList.toggle('active', b.textContent.toLowerCase().includes(tab));
  });
  renderTab();
}

function renderTab(){
  const container = document.getElementById('tab-content');
  if(currentTab === 'products'){
    renderProductsTab(container);
  } else if(currentTab === 'categories'){
    renderCategoriesTab(container);
  } else {
    container.innerHTML = `<div class="card"><h2>${currentTab.toUpperCase()}</h2><p style="color:var(--muted)">Section view standard implementation active.</p></div>`;
  }
}

function renderProductsTab(container){
  const catOptions = categories.map(c => `<option value="${esc(c.id)}">${esc(c.name_en || c.name)}</option>`).join('');
  
  container.innerHTML = `
    <div class="card">
      <h2>Products</h2>
      <form id="productForm" onsubmit="saveProduct(event)">
        <div class="form-grid">
          <div class="field">
            <label>Name EN</label>
            <input type="text" id="p_name_en" required>
          </div>
          <div class="field">
            <label>Name AR</label>
            <input type="text" id="p_name_ar">
          </div>
          <div class="field">
            <label>Category</label>
            <select id="p_category">
              <option value="">Select category</option>
              ${catOptions}
            </select>
          </div>
          <div class="field">
            <label>Description EN</label>
            <textarea id="p_desc_en"></textarea>
          </div>
          <div class="field">
            <label>Description AR</label>
            <textarea id="p_desc_ar"></textarea>
          </div>
          <div class="field">
            <label>Retail Price</label>
            <input type="number" step="0.01" id="p_price" required>
          </div>
          <div class="field">
            <label>Stock Quantity</label>
            <input type="number" id="p_stock" value="0">
          </div>
          <div class="field">
            <label>Sort Order</label>
            <input type="number" id="p_sort" value="0">
          </div>
          <div class="field">
            <label>Image</label>
            <input type="file" id="p_image" accept="image/*">
          </div>
          <div class="field">
            <label>Active</label>
            <select id="p_active">
              <option value="true">Yes</option>
              <option value="false">No</option>
            </select>
          </div>
          <div class="field">
            <label>Natural Product</label>
            <select id="p_natural">
              <option value="false">No</option>
              <option value="true">Yes</option>
            </select>
          </div>
        </div>
        <div class="btn-group">
          <button type="submit" class="btn-primary">Save Product</button>
          <button type="button" class="btn-secondary" onclick="resetProductForm()">Refresh</button>
        </div>
      </form>
    </div>

    <div class="card">
      <table>
        <thead>
          <tr>
            <th>Product</th>
            <th>Category</th>
            <th>Price</th>
            <th>Stock</th>
            <th>Natural</th>
            <th>Active</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody>
          ${products.map(p => `
            <tr>
              <td><b>${esc(p.name_en || p.name_ar || 'Untitled')}</b></td>
              <td>${esc(p.category_id || '-')}</td>
              <td>$${Number(p.retail_price||0).toFixed(2)}</td>
              <td>${Number(p.stock_quantity||0)}</td>
              <td>${p.is_natural ? 'Yes' : 'No'}</td>
              <td>${p.active !== false ? 'Yes' : 'No'}</td>
              <td>
                <button class="btn-danger" onclick="deleteProduct('${esc(p.id)}')">Delete</button>
              </td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    </div>
  `;
}

function renderCategoriesTab(container){
  container.innerHTML = `
    <div class="card">
      <h2>Categories</h2>
      <form onsubmit="saveCategory(event)">
        <div class="form-grid">
          <div class="field">
            <label>Category Name EN</label>
            <input type="text" id="c_name_en" required>
          </div>
          <div class="field">
            <label>Icon / Emoji</label>
            <input type="text" id="c_icon" placeholder="e.g. 🛠️">
          </div>
          <div class="field">
            <label>Sort Order</label>
            <input type="number" id="c_sort" value="0">
          </div>
        </div>
        <button type="submit" class="btn-primary">Save Category</button>
      </form>
    </div>

    <div class="card">
      <table>
        <thead>
          <tr>
            <th>Icon</th>
            <th>Name</th>
            <th>Sort Order</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody>
          ${categories.map(c => `
            <tr>
              <td>${esc(c.icon || '📦')}</td>
              <td><b>${esc(c.name_en || c.name)}</b></td>
              <td>${Number(c.sort_order||0)}</td>
              <td>
                <button class="btn-danger" onclick="deleteCategory('${esc(c.id)}')">Delete</button>
              </td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    </div>
  `;
}

async function saveProduct(e){
  e.preventDefault();
  const payload = {
    name_en: document.getElementById('p_name_en').value,
    name_ar: document.getElementById('p_name_ar').value,
    category_id: document.getElementById('p_category').value || null,
    description_en: document.getElementById('p_desc_en').value,
    description_ar: document.getElementById('p_desc_ar').value,
    retail_price: parseFloat(document.getElementById('p_price').value) || 0,
    stock_quantity: parseInt(document.getElementById('p_stock').value) || 0,
    sort_order: parseInt(document.getElementById('p_sort').value) || 0,
    active: document.getElementById('p_active').value === 'true',
    is_natural: document.getElementById('p_natural').value === 'true'
  };

  const { error } = await sb.from('products').insert([payload]);
  if(error) return toast(error.message);

  toast('Product saved!');
  resetProductForm();
  init();
}

async function deleteProduct(id){
  if(!confirm('Are you sure you want to delete this product?')) return;
  const { error } = await sb.from('products').delete().eq('id', id);
  if(error) return toast(error.message);
  toast('Product deleted');
  init();
}

async function saveCategory(e){
  e.preventDefault();
  const payload = {
    id: 'cat_' + Date.now(),
    name_en: document.getElementById('c_name_en').value,
    icon: document.getElementById('c_icon').value || '📦',
    sort_order: parseInt(document.getElementById('c_sort').value) || 0,
    active: true
  };

  const { error } = await sb.from('categories').insert([payload]);
  if(error) return toast(error.message);

  toast('Category saved!');
  init();
}

async function deleteCategory(id){
  if(!confirm('Delete this category?')) return;
  const { error } = await sb.from('categories').delete().eq('id', id);
  if(error) return toast(error.message);
  toast('Category deleted');
  init();
}

function resetProductForm(){
  const f = document.getElementById('productForm');
  if(f) f.reset();
}

function logout(){
  sb.auth.signOut().then(() => {
    window.location.href = '/index.html';
  });
}

init();
</script>
</body>
</html>
