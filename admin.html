<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Smartly Admin</title><link rel="icon" href="/icon-192.svg" type="image/svg+xml">
<style>
body{margin:0;font-family:Arial,sans-serif;background:#f5f7f9;color:#17212b}.top{background:#123b5d;color:#fff;padding:18px 4%;display:flex;justify-content:space-between;align-items:center}.wrap{max-width:1250px;margin:auto;padding:20px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 20px}.tab,.btn{padding:10px 13px;border-radius:9px;border:1px solid #dbe2e7;background:#fff;cursor:pointer;font-weight:700}.btn{background:#159a9c;color:#fff;border:0}.danger{background:#d94a45}.dark{background:#123b5d}.panel{background:#fff;border:1px solid #ddd;border-radius:14px;padding:18px;margin-bottom:15px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.field label{display:block;font-size:12px;font-weight:700;margin-bottom:5px}.field input,.field select,.field textarea{width:100%;padding:10px;border:1px solid #ddd;border-radius:8px;box-sizing:border-box}.field textarea{min-height:90px}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:9px;border-bottom:1px solid #eee;text-align:left;vertical-align:top}.tablewrap{overflow:auto}.hidden{display:none}.msg{padding:10px;border-radius:9px;background:#fff5df;margin:10px 0}.actions{display:flex;gap:6px;flex-wrap:wrap}.small{font-size:12px;color:#68727d}#login{position:fixed;inset:0;background:#123b5df2;display:flex;align-items:center;justify-content:center;z-index:9999}.loginbox{background:#fff;padding:28px;border-radius:16px;width:min(420px,90%)}@media(max-width:800px){.grid{grid-template-columns:1fr}.top{gap:10px;align-items:flex-start}.tabs{margin-top:12px}}
</style>
</head>
<body>
<div id="login"><div class="loginbox"><h2 style="color:#123b5d">Smartly Admin</h2><p>Only authorized admin accounts can access this panel.</p><div class="field"><label>Email</label><input id="loginEmail" type="email" autocomplete="username"></div><br><div class="field"><label>Password</label><input id="loginPassword" type="password" autocomplete="current-password"></div><br><button class="btn dark" style="width:100%" onclick="doLogin()">Login</button><p id="loginMsg" class="small"></p></div></div>
<header class="top"><div><b>Smartly Admin</b><br><small>Store operations & content management</small></div><button class="btn danger" onclick="logout()">Logout</button></header>
<main class="wrap"><div class="tabs">
<button class="tab" onclick="show('dashboard')">Dashboard</button><button class="tab" onclick="show('orders')">Orders</button><button class="tab" onclick="show('products')">Products</button><button class="tab" onclick="show('categories')">Categories</button><button class="tab" onclick="show('countries')">Countries</button><button class="tab" onclick="show('bundles')">Bundles & Offers</button><button class="tab" onclick="show('natural')">Natural Products</button><button class="tab" onclick="show('payments')">Payments</button><button class="tab" onclick="show('reservations')">Reservations</button><button class="tab" onclick="show('reviews')">Reviews</button><button class="tab" onclick="show('special')">Special Requests</button><button class="tab" onclick="show('customers')">Customers</button><button class="tab" onclick="show('admins')">Admins</button><button class="tab" onclick="show('settings')">Settings</button>
</div><div id="app"></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/config.js"></script>
<script>
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);let current='',editId=null,rowsCache=[];
const maps={products:'products',categories:'categories',countries:'countries',bundles:'bundles',payments:'payment_methods',orders:'orders',reservations:'reservations',reviews:'reviews',special:'special_requests',customers:'customer_profiles',admins:'admin_users',settings:'site_settings'};
const titles={products:'Products',categories:'Categories',countries:'Countries',bundles:'Bundles & Offers',natural:'Natural Products',payments:'Payment Methods',orders:'Orders',reservations:'Reservations',reviews:'Reviews',special:'Special Requests',customers:'Customers',admins:'Admins',settings:'Settings'};
const $=id=>document.getElementById(id);function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function guard(){const {data:{session}}=await sb.auth.getSession();if(!session){$('login').style.display='flex';return false}const r=await sb.rpc('is_admin');if(r.error||r.data!==true){await sb.auth.signOut();$('login').style.display='flex';$('loginMsg').textContent='This account is not authorized as an admin.';return false}$('login').style.display='none';return true}
async function doLogin(){const r=await sb.auth.signInWithPassword({email:$('loginEmail').value.trim(),password:$('loginPassword').value});if(r.error){$('loginMsg').textContent=r.error.message;return}if(await guard())show('dashboard')}
async function logout(){await sb.auth.signOut();location.reload()}
function show(t){current=t;editId=null;if(t==='dashboard'){dashboard();return}if(t==='natural'){showNatural();return}app.innerHTML=`<div class="panel"><h2>${titles[t]||t}</h2><p class="small">Manage this section without editing the customer website.</p><div id="form"></div><div id="formMsg"></div></div><div class="panel"><div class="actions"><button class="btn" onclick="loadTable()">Refresh</button><button class="btn dark" onclick="exportCSV()">Export to Excel / CSV</button></div><div id="table" class="tablewrap" style="margin-top:15px"></div></div>`;renderForm();loadTable()}
function dashboard(){app.innerHTML='<div class="panel"><h2>Dashboard</h2><p>Smartly store control center.</p><div class="grid"><div class="panel"><b>Products</b><div id="dc1">…</div></div><div class="panel"><b>Orders</b><div id="dc2">…</div></div><div class="panel"><b>Reservations</b><div id="dc3">…</div></div></div><div class="msg"><b>Security:</b> this panel is hidden behind Supabase Auth and the <code>admin_users</code> role check. RLS is required for all database writes.</div></div>';Promise.all(['products','orders','reservations'].map(t=>sb.from(t).select('*',{count:'exact',head:true}))).then(x=>{if($('dc1'))$('dc1').textContent=x[0].count??0;if($('dc2'))$('dc2').textContent=x[1].count??0;if($('dc3'))$('dc3').textContent=x[2].count??0})}
function showNatural(){current='products';app.innerHTML='<div class="panel"><h2>Natural Products</h2><p>Products with <b>Natural product = Yes</b>. Use Products to add/edit them.</p><button class="btn" onclick="show(\'products\')">Manage Products</button></div><div class="panel"><div id="table" class="tablewrap"></div></div>';loadNatural()}
async function loadNatural(){const r=await sb.from('products').select('*').eq('is_natural',true).order('sort_order').limit(500);if(r.error)return tableEl(r.error.message);rowsCache=r.data||[];tableEl(makeTable(rowsCache,['id','name_en','retail_price','stock_quantity','active','image_url']))}
function renderForm(){let html='';if(current==='products')html=`<div class="grid"><div class="field"><label>Name EN *</label><input id="f1"></div><div class="field"><label>Name AR</label><input id="f2"></div><div class="field"><label>Description EN</label><textarea id="f3"></textarea></div><div class="field"><label>Category ID</label><input id="f4" placeholder="smart-tools"></div><div class="field"><label>Price</label><input id="f5" type="number" step=".01"></div><div class="field"><label>Quantity</label><input id="f6" type="number" min="0"></div><div class="field"><label>Image URL</label><input id="f7"></div><div class="field"><label>Upload product image</label><input id="f10" type="file" accept="image/*"></div><div class="field"><label>Natural product?</label><select id="f8"><option value="false">No</option><option value="true">Yes</option></select></div><div class="field"><label>Active?</label><select id="f9"><option value="true">Yes</option><option value="false">No</option></select></div></div>`;
else if(current==='categories')html=`<div class="grid"><div class="field"><label>ID *</label><input id="f1"></div><div class="field"><label>Name EN *</label><input id="f2"></div><div class="field"><label>Name AR</label><input id="f3"></div><div class="field"><label>Icon</label><input id="f4" value="✨"></div><div class="field"><label>Active</label><select id="f5"><option value="true">Yes</option><option value="false">No</option></select></div></div>`;
else if(current==='countries')html=`<div class="grid"><div class="field"><label>Country *</label><input id="f1"></div><div class="field"><label>Country code</label><input id="f2" placeholder="LB"></div><div class="field"><label>Phone code</label><input id="f3" placeholder="+961"></div><div class="field"><label>Active</label><select id="f4"><option value="true">Yes</option><option value="false">No</option></select></div></div>`;
else if(current==='payments')html=`<div class="grid"><div class="field"><label>Payment method *</label><input id="f1" placeholder="Whish Money"></div><div class="field"><label>Active</label><select id="f2"><option value="true">Yes</option><option value="false">No</option></select></div></div>`;
else if(current==='bundles')html=`<div class="grid"><div class="field"><label>Name EN *</label><input id="f1"></div><div class="field"><label>Description</label><textarea id="f2"></textarea></div><div class="field"><label>Price</label><input id="f3" type="number" step=".01"></div><div class="field"><label>Image URL</label><input id="f4"></div><div class="field"><label>Active</label><select id="f5"><option value="true">Yes</option><option value="false">No</option></select></div></div>`;
else if(current==='reviews')html=`<div class="grid"><div class="field"><label>Customer name *</label><input id="f1"></div><div class="field"><label>Product</label><input id="f2"></div><div class="field"><label>Rating</label><input id="f3" type="number" min="1" max="5"></div><div class="field"><label>Comment *</label><textarea id="f4"></textarea></div><div class="field"><label>Approved / Visible</label><select id="f5"><option value="true">Yes</option><option value="false">No</option></select></div></div>`;
else if(current==='settings')html=`<div class="grid"><div class="field"><label>Setting key *</label><input id="f1" placeholder="delivery_policy"></div><div class="field"><label>Setting value</label><textarea id="f2"></textarea></div></div>`;
else if(current==='admins')html=`<div class="grid"><div class="field"><label>Supabase Auth User UUID *</label><input id="f1" placeholder="Paste the user's UUID"></div><div class="field"><label>Email</label><input id="f2" type="email"></div><div class="field"><label>Active</label><select id="f3"><option value="true">Yes</option><option value="false">No</option></select></div></div><p class="small">Create the person first in Supabase Authentication → Users, copy their User UID, then add that UID here.</p>`;
else html=`<p class="small">This is an operational table. Use the Edit/Delete actions below. Orders and reservations should normally be created by customers.</p>`;
$('form').innerHTML=html+(['products','categories','countries','payments','bundles','reviews','settings','admins'].includes(current)?'<br><button class="btn" onclick="save()">Save</button> <button class="btn" onclick="clearForm()">Clear</button>':'')}
function clearForm(){document.querySelectorAll('#form input,#form textarea').forEach(x=>x.value='');document.querySelectorAll('#form select').forEach(x=>x.selectedIndex=0);editId=null}
function fillForm(x){editId=x.id||x.user_id;const set=(id,v)=>{const e=$(id);if(e)e.value=v??''};if(current==='products'){set('f1',x.name_en);set('f2',x.name_ar);set('f3',x.description_en);set('f4',x.category_id);set('f5',x.retail_price);set('f6',x.stock_quantity);set('f7',x.image_url);set('f8',String(x.is_natural));set('f9',String(x.active))}else if(current==='categories'){set('f1',x.id);set('f2',x.name_en);set('f3',x.name_ar);set('f4',x.icon);set('f5',String(x.active))}else if(current==='countries'){set('f1',x.name);set('f2',x.country_code);set('f3',x.phone_code);set('f4',String(x.active))}else if(current==='payments'){set('f1',x.name);set('f2',String(x.active))}else if(current==='bundles'){set('f1',x.name_en);set('f2',x.description_en);set('f3',x.price);set('f4',x.image_url);set('f5',String(x.active))}else if(current==='reviews'){set('f1',x.customer_name);set('f2',x.product_name);set('f3',x.rating);set('f4',x.comment);set('f5',String(x.approved))}else if(current==='settings'){set('f1',x.setting_key);set('f2',x.setting_value)}else if(current==='admins'){set('f1',x.user_id);set('f2',x.email);set('f3',String(x.active))}window.scrollTo({top:0,behavior:'smooth'})}
async function save(){let row={};if(current==='products')row={name_en:$('f1').value.trim(),name_ar:$('f2').value,description_en:$('f3').value,category_id:$('f4').value||null,retail_price:Number($('f5').value||0),stock_quantity:Number($('f6').value||0),image_url:$('f7').value||null,is_natural:$('f8').value==='true',active:$('f9').value==='true'};if(current==='categories')row={id:$('f1').value.trim(),name_en:$('f2').value.trim(),name_ar:$('f3').value,icon:$('f4').value||'✨',active:$('f5').value==='true'};if(current==='countries')row={name:$('f1').value.trim(),country_code:$('f2').value.trim(),phone_code:$('f3').value.trim(),active:$('f4').value==='true'};if(current==='payments')row={name:$('f1').value.trim(),active:$('f2').value==='true'};if(current==='bundles')row={name_en:$('f1').value.trim(),description_en:$('f2').value,price:Number($('f3').value||0),image_url:$('f4').value||null,active:$('f5').value==='true'};if(current==='reviews')row={customer_name:$('f1').value.trim(),product_name:$('f2').value,rating:Number($('f3').value),comment:$('f4').value,approved:$('f5').value==='true'};if(current==='settings')row={setting_key:$('f1').value.trim(),setting_value:$('f2').value,updated_at:new Date().toISOString()};if(current==='admins')row={user_id:$('f1').value.trim(),email:$('f2').value.trim()||null,active:$('f3').value==='true'};if(current==='products'){const file=$('f10')?.files?.[0];if(file){const safe=file.name.replace(/[^a-zA-Z0-9._-]/g,'_');const path=Date.now()+'-'+safe;const up=await sb.storage.from('product-images').upload(path,file,{upsert:false});if(up.error)return alert('Image upload failed: '+up.error.message);row.image_url=sb.storage.from('product-images').getPublicUrl(path).data.publicUrl}}if(!Object.values(row)[0])return alert('Required field missing');let q=editId?sb.from(maps[current]).update(row).eq(current==='admins'?'user_id':'id',editId):sb.from(maps[current]).insert(row);const r=await q;if(r.error)return alert(r.error.message);alert('Saved');clearForm();loadTable()}
function makeTable(rows,keys){if(!rows.length)return '<div class="msg">No records yet.</div>';const shown=keys||Object.keys(rows[0]).slice(0,12);let h='<table class="table"><tr>'+shown.map(k=>`<th>${esc(k)}</th>`).join('')+'<th>Actions</th></tr>';h+=rows.map((x,i)=>`<tr>${shown.map(k=>`<td>${esc(x[k])}</td>`).join('')}<td class="actions"><button class="btn" onclick="fillForm(rowsCache[${i}])">Edit</button><button class="btn danger" onclick="del('${esc(x.id||x.user_id||'')}')">Delete</button></td></tr>`).join('');return h+'</table>'}
async function loadTable(){const table=maps[current];if(!table)return;let q=sb.from(table).select('*').limit(500);if(current==='products')q=q.order('sort_order');else if(current==='categories'||current==='countries'||current==='bundles'||current==='payments')q=q.order('sort_order');else if(current==='settings')q=q.order('setting_key');else q=q.order('created_at',{ascending:false,nullsFirst:false});const r=await q;if(r.error)return tableEl(r.error.message);rowsCache=r.data||[];tableEl(makeTable(rowsCache))}
function tableEl(x){$('table').innerHTML=x}
async function del(id){if(!id||!confirm('Delete this record?'))return;const key=current==='admins'?'user_id':'id';const r=await sb.from(maps[current]).delete().eq(key,id);if(r.error)alert(r.error.message);else loadTable()}
async function exportCSV(){const table=maps[current];if(!table)return;const r=await sb.from(table).select('*').limit(5000);if(r.error)return alert(r.error.message);const rows=r.data||[];if(!rows.length)return alert('No data to export.');const keys=Object.keys(rows[0]);const csv=[keys.join(',')].concat(rows.map(x=>keys.map(k=>`"${String(x[k]??'').replaceAll('"','""')}"`).join(','))).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='smartly-'+current+'-'+new Date().toISOString().slice(0,10)+'.csv';a.click()}
sb.auth.onAuthStateChange(()=>setTimeout(guard,0));guard().then(ok=>{if(ok)show('dashboard')});
</script>
</body></html>
