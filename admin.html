<!doctype html>
<html lang="en">
<head>

<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5f7f9;color:#17212b}button,input,select,textarea{font:inherit}button{cursor:pointer}.top{background:#123B5D;color:#fff;padding:18px}.wrap{max-width:1250px;margin:auto;padding:18px}.login{max-width:430px;margin:8vh auto}.panel{background:#fff;border:1px solid #ddd;border-radius:14px;padding:18px;margin-bottom:16px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.field label{display:block;font-size:12px;font-weight:700;margin-bottom:5px}.field input,.field select,.field textarea{width:100%;padding:10px;border:1px solid #d9dee3;border-radius:8px;background:#fff}.field textarea{min-height:90px}.btn{padding:10px 14px;border:0;border-radius:8px;background:#159A9C;color:#fff;font-weight:700}.dark{background:#123B5D}.danger{background:#D94A45}.muted{color:#68727d}.tabs{display:flex;gap:7px;flex-wrap:wrap;margin:15px 0}.tab{padding:10px 12px;border:1px solid #ddd;background:#fff;border-radius:9px}.tab.active{background:#123B5D;color:#fff}.actions{display:flex;gap:7px;flex-wrap:wrap}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:760px}.table th,.table td{padding:9px;border-bottom:1px solid #eee;text-align:left;vertical-align:top}.status{font-weight:700}.hidden{display:none}.statgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat{background:#fff;border:1px solid #ddd;border-radius:12px;padding:15px}.stat b{display:block;font-size:25px;margin-top:6px}.msg{padding:10px;border-radius:8px;margin:10px 0}.ok{background:#e8f7ef}.err{background:#fdeceb}.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;z-index:100}.modal.show{display:flex}.modal-box{background:#fff;width:min(650px,95%);max-height:90vh;overflow:auto;border-radius:12px;padding:20px;position:relative}.badge{padding:3px 8px;border-radius:12px;font-size:11px;font-weight:700;display:inline-block}.badge.pending{background:#fff3cd;color:#856404}.badge.approved,.badge.completed{background:#d4edda;color:#155724}.badge.rejected,.badge.cancelled{background:#f8d7da;color:#721c24}@media(max-width:850px){.grid,.statgrid{grid-template-columns:1fr 1fr}}@media(max-width:550px){.grid,.statgrid{grid-template-columns:1fr}}
</style>
</head>
<body>

<div id="loginView" class="login panel">
  <h1>Smartly Admin</h1>
  <p class="muted">Sign in with your authorized administrator account.</p>
  <form onsubmit="event.preventDefault(); login();">
    <div class="field">
      <label>Email</label>
      <input id="loginEmail" type="email" autocomplete="email" required>
    </div><br>
    <div class="field">
      <label>Password</label>
      <input id="loginPassword" type="password" autocomplete="current-password" required>
    </div><br>
    <button type="submit" class="btn dark">Sign in</button>
  </form>
  <div id="loginMsg"></div>
</div>

<div id="adminView" class="hidden">
<header class="top">
  <div class="wrap">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:12px">
      <div>
        <h2 style="margin:0">Smartly Admin</h2>
        <small>Storefront management</small>
      </div>
      <button class="btn" onclick="logout()">Sign out</button>
    </div>
  </div>
</header>
<div class="wrap">
  <div class="tabs" id="tabs"></div>
  <div id="app"></div>
</div>
</div>

<!-- RECORD VIEW MODAL -->
<div class="modal" id="recordModal">
  <div class="modal-box">
    <button class="btn danger" style="position:absolute;top:15px;right:15px;padding:4px 8px;" onclick="closeModal()">×</button>
    <div id="modalContent"></div>
  </div>
</div>

  { code: 'CN', name: 'China' }, { code: 'JP', name: 'Japan' }, { code: 'IN', name: 'India' },

let current = 'dashboard', categories = [], countries = [];
let editingId = null;

const tabs = [
  ['dashboard','Dashboard'],
  ['orders','Orders'],
  ['products','Products'],
  ['categories','Categories'],
  ['countries','Countries'],
  ['delivery','Delivery Fees'],
  ['bundles','Bundles & Offers'],

function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function msg(text,error=false){return `<div class="msg ${error?'err':'ok'}">${esc(text)}</div>`}

function closeModal(){
  document.getElementById('recordModal').classList.remove('show');
}

async function login(){
  const email = loginEmail.value.trim();
  const password = loginPassword.value;
  if(!email || !password){
    loginMsg.innerHTML = msg('Email and password are required.', true);
    return;
  }
  const r = await sb.auth.signInWithPassword({email, password});
  if(r.error){
    loginMsg.innerHTML = msg(r.error.message, true);
    return;
  }
  const a = await sb.rpc('is_admin');
  if(a.error || a.data !== true){
    await sb.auth.signOut();
    loginMsg.innerHTML = msg('This account is not an active administrator.', true);
    return;
  }
  showAdmin();
}

async function logout(){
  await sb.auth.signOut();
  location.reload();
}

async function guard(){
  const s = await sb.auth.getSession();
  if(!s.data.session) return;
  const a = await sb.rpc('is_admin');
  if(!a.error && a.data === true) showAdmin();
}

function showAdmin(){
  loginView.classList.add('hidden');
  adminView.classList.remove('hidden');
  renderTabs();
  show('dashboard');
}

function renderTabs(){
  const tabsEl = document.getElementById('tabs');
  tabsEl.innerHTML = tabs.map(x=>`<button class="tab ${current===x[0]?'active':''}" onclick="show('${x[0]}')">${x[1]}</button>`).join('');
}

function show(t){
  current = t;
  editingId = null;
  renderTabs();
  const app = document.getElementById('app');
  if(t==='dashboard') return dashboard();
  if(t==='products'||t==='natural') return productsPage(t==='natural');
  if(t==='categories') return categoriesPage();
  if(t==='countries') return countriesPage();
  if(t==='delivery') return deliveryFeesPage();
  if(t==='bundles') return bundlesPage();
  if(t==='payments') return paymentsPage();
  if(t==='orders') return ordersPage();
  if(t==='reservations') return reservationsPage();
  if(t==='reviews') return reviewsPage();
  if(t==='special') return specialPage();
  if(t==='customers') return customersPage();
  if(t==='settings') return settingsPage();
}

async function count(table){
  const r = await sb.from(table).select('*', {count:'exact', head:true});
  return r.count || 0;
}

async function dashboard(){
  const app = document.getElementById('app');
  app.innerHTML = '<div class="panel"><h2>Dashboard</h2><p class="muted">Loading...</p></div>';
  const [p,o,r,s,rev] = await Promise.all([count('products'), count('orders'), count('reservations'), count('special_requests'), count('reviews')]);
  app.innerHTML = `<div class="panel"><h2>Dashboard</h2><p class="muted">Store overview</p></div><div class="statgrid"><div class="stat">Products<b>${p}</b></div><div class="stat">Orders<b>${o}</b></div><div class="stat">Reservations<b>${r}</b></div><div class="stat">Special Requests<b>${s}</b></div><div class="stat">Reviews<b>${rev}</b></div></div>`;
}

function formField(id,label,type='text',extra=''){
  return `<div class="field"><label>${label}</label><input id="${id}" type="${type}" ${extra}></div>`;
}

async function loadRefs(){
  const [c,co] = await Promise.all([
    sb.from('categories').select('id,name,name_en').order('sort_order'),
    sb.from('countries').select('id,name,name_en').order('sort_order')
  ]);
  categories = c.data || [];
  countries = co.data || [];
}

async function productsPage(natural=false){
  await loadRefs();

  const app = document.getElementById('app');
  app.innerHTML = `<div class="panel"><h2 id="formTitle">${natural?'Natural Products':'Products'}</h2><div class="grid">${formField('p_name_en','Name EN')}${formField('p_name_ar','Name AR')}<div class="field"><label>Category</label><select id="p_category"><option value="">Select category</option>${categories.map(c=>`<option value="${esc(c.id)}">${esc(c.name_en||c.name)}</option>`).join('')}</select></div>${formField('p_desc_en','Description EN')}${formField('p_desc_ar','Description AR')}${formField('p_price','Retail Price','number','step="0.01"')}${formField('p_stock','Stock Quantity','number','min="0"')}${formField('p_sort','Sort Order','number','value="0"')}<div class="field"><label>Image</label><input id="p_image" type="file" accept="image/*"></div><div class="field"><label>Active</label><select id="p_active"><option value="true">Yes</option><option value="false">No</option></select></div><div class="field"><label>Natural Product</label><select id="p_natural"><option value="${natural?'true':'false'}">${natural?'Yes':'No'}</option><option value="${natural?'false':'true'}">${natural?'No':'Yes'}</option></select></div></div><br><div class="actions"><button class="btn" id="saveBtn" onclick="saveProduct()">Save Product</button><button class="tab hidden" id="cancelBtn" onclick="productsPage(${natural})">Cancel Edit</button><button class="tab" onclick="loadProducts()">Refresh</button></div><div id="formMsg"></div></div><div class="panel"><div id="table"></div></div>`;
  loadProducts();
}

async function saveProduct(){
  const name = p_name_en.value.trim();
  if(!name) return formMsg.innerHTML = msg('Product name is required.', true);
  let image_url = '';
  const f = p_image.files[0];
  if(f){
    const path = `${Date.now()}-${f.name.replace(/[^a-zA-Z0-9._-]/g,'_')}`;
    const u = await sb.storage.from('products').upload(path, f, {upsert:false});
    if(u.error) return formMsg.innerHTML = msg(u.error.message, true);
    image_url = sb.storage.from('products').getPublicUrl(path).data.publicUrl;
  }
  const row = {
    name_en: name,
    name_ar: p_name_ar.value.trim(),
    description_en: p_desc_en.value.trim(),
    description_ar: p_desc_ar.value.trim(),
    category_id: p_category.value || null,
    retail_price: Number(p_price.value || 0),
    stock_quantity: Number(p_stock.value || 0),
    active: p_active.value === 'true',
    is_natural: p_natural.value === 'true',
    sort_order: Number(p_sort.value || 0)
  };
  if(image_url) row.image_url = image_url;
  
  let r;
  if(editingId) {
    r = await sb.from('products').update(row).eq('id', editingId);
  } else {
    r = await sb.from('products').insert(row);
  }

  formMsg.innerHTML = r.error ? msg(r.error.message, true) : msg(editingId ? 'Product updated successfully.' : 'Product saved successfully.');
  if(!r.error) {
    if(editingId) productsPage(current === 'natural');
    else loadProducts();
  }
}

async function editProduct(id){
  const r = await sb.from('products').select('*').eq('id', id).single();
  if(r.error) return alert(r.error.message);
  const item = r.data;
  editingId = item.id;
  p_name_en.value = item.name_en || '';
  p_name_ar.value = item.name_ar || '';
  p_category.value = item.category_id || '';
  p_desc_en.value = item.description_en || '';
  p_desc_ar.value = item.description_ar || '';
  p_price.value = item.retail_price || 0;
  p_stock.value = item.stock_quantity || 0;
  p_sort.value = item.sort_order || 0;
  p_active.value = item.active ? 'true' : 'false';
  p_natural.value = item.is_natural ? 'true' : 'false';
  
  document.getElementById('formTitle').innerText = 'Edit Product';
  document.getElementById('saveBtn').innerText = 'Update Product';
  document.getElementById('cancelBtn').classList.remove('hidden');
  window.scrollTo({top: 0, behavior: 'smooth'});
}

async function loadProducts(){
  const natural = current === 'natural';
  const q = sb.from('products').select('*').order('sort_order').limit(200);
  if(natural) q.eq('is_natural', true);
  const r = await q;
  if(r.error) return table.innerHTML = msg(r.error.message, true);
  table.innerHTML = `<div class="table-wrap"><table class="table"><tr><th>Product</th><th>Category</th><th>Price</th><th>Stock</th><th>Natural</th><th>Active</th><th>Action</th></tr>${(r.data||[]).map(x=>`<tr><td>${esc(x.name_en||x.name_ar)}</td><td>${esc(x.category_id)}</td><td>$${Number(x.retail_price||0).toFixed(2)}</td><td>${x.stock_quantity??0}</td><td>${x.is_natural?'Yes':'No'}</td><td>${x.active?'Yes':'No'}</td><td><button class="btn" onclick="editProduct('${esc(x.id)}')">Edit</button> <button class="btn danger" onclick="deleteRow('products','${esc(x.id)}')">Delete</button></td></tr>`).join('')}</table></div>`;
}

async function handleOrderStatusChange(orderId, oldStatus, newStatus){
  if(oldStatus === newStatus) return;

  const r = await sb.from('orders').update({status: newStatus}).eq('id', orderId);
  if(r.error) return alert('Failed to update order status: ' + r.error.message);

  if(newStatus === 'confirmed' && oldStatus !== 'confirmed'){
    await adjustOrderInventory(orderId, 'decrease');
  } else if(newStatus === 'cancelled' && oldStatus === 'confirmed'){
    await adjustOrderInventory(orderId, 'increase');
  }

  ordersPage();
}

async function adjustOrderInventory(orderId, mode){
  const itemsRes = await sb.from('order_items').select('product_id, quantity').eq('order_id', orderId);
  if(itemsRes.error || !itemsRes.data) return;

  for(const item of itemsRes.data){
    if(!item.product_id) continue;
    const prodRes = await sb.from('products').select('stock_quantity').eq('id', item.product_id).single();
    if(prodRes.data){
      let newStock = Number(prodRes.data.stock_quantity || 0);
      if(mode === 'decrease') newStock -= item.quantity;
      if(mode === 'increase') newStock += item.quantity;
      if(newStock < 0) newStock = 0;
      await sb.from('products').update({ stock_quantity: newStock }).eq('id', item.product_id);
    }
  }
}

function genericTable(data, fields, actions=true, table_name=''){
  if(!data.length) return '<p class="muted">No items found.</p>';
  return `<div class="table-wrap"><table class="table"><tr>${fields.map(f=>`<th>${esc(f.replace('_',' '))}</th>`).join('')}${actions?'<th>Action</th>':''}</tr>${data.map(x=>`<tr>${fields.map(f=>`<td>${esc(x[f])}</td>`).join('')}${actions?`<td>${table_name==='categories'?`<button class="btn" onclick="editCategory('${x.id}')">Edit</button>`:table_name==='countries'?`<button class="btn" onclick="editCountry('${x.id}')">Edit</button>`:table_name==='delivery_fees'?`<button class="btn" onclick="editDeliveryFee('${x.id}')">Edit</button>`:table_name==='bundles'?`<button class="btn" onclick="editBundle('${x.id}')">Edit</button>`:table_name==='payment_methods'?`<button class="btn" onclick="editPayment('${x.id}')">Edit</button>`:table_name==='customer_profiles'?`<button class="btn" onclick="editCustomer('${x.id}')">Edit</button>`:''}<button class="btn danger" onclick="deleteRow('${table_name}','${x.id}')">Delete</button></td>`:''}</tr>`).join('')}</table></div>`;
}

async function viewRecord(table_name, id){
  const r = await sb.from(table_name).select('*, order_items(*)').eq('id', id).single();
  if(r.error) return alert(r.error.message);
  
  const item = r.data;
  let html = `<h3>Order Details #${esc(item.order_number||item.id)}</h3>`;
  html += `<p><b>Customer:</b> ${esc(item.name)}<br><b>Phone:</b> ${esc(item.phone)}<br><b>Address:</b> ${esc(item.location||'')}, ${esc(item.country||'')}</p>`;
  if(item.order_items && item.order_items.length){
    html += `<h4>Items Ordered</h4><ul>`;
    item.order_items.forEach(i=>{
      html += `<li>${esc(i.product_name||'Product')} x ${i.quantity} - $${Number(i.unit_price||0).toFixed(2)}</li>`;
    });
    html += `</ul>`;
  }
  html += `<p><b>Total Amount:</b> $${Number(item.total||0).toFixed(2)}</p>`;
  
  document.getElementById('modalContent').innerHTML = html;
  document.getElementById('recordModal').classList.add('show');
}

async function deleteRow(table_name, id){

  const r = await sb.from(table_name).delete().eq('id', id);
  if(r.error) alert(r.error.message);

}
