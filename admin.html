<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Smartly Admin</title><style>
body{margin:0;font-family:Arial;background:#f5f7f9;color:#17212b}.top{background:#123B5D;color:#fff;padding:18px}.wrap{max-width:1200px;margin:auto;padding:18px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0}.tab{padding:10px 13px;border:1px solid #ddd;background:#fff;border-radius:9px}.panel{background:#fff;border:1px solid #ddd;border-radius:14px;padding:18px;margin-bottom:15px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.field label{display:block;font-size:12px;font-weight:700;margin-bottom:5px}.field input,.field select,.field textarea{width:100%;padding:10px;border:1px solid #ddd;border-radius:8px;box-sizing:border-box}.btn{padding:10px 14px;border:0;border-radius:8px;background:#159A9C;color:#fff;font-weight:700}.danger{background:#D94A45}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:9px;border-bottom:1px solid #eee;text-align:left}@media(max-width:800px){.grid{grid-template-columns:1fr}}
</style></head><body><div class="top"><div class="wrap"><h2>Smartly Admin</h2><small>Manage the storefront without editing the customer website.</small></div></div><div class="wrap">
<div class="tabs">
<button class="tab" onclick="show('dashboard')">Dashboard</button><button class="tab" onclick="show('orders')">Orders</button><button class="tab" onclick="show('products')">Products</button><button class="tab" onclick="show('categories')">Categories</button><button class="tab" onclick="show('countries')">Countries</button><button class="tab" onclick="show('bundles')">Bundles & Offers</button><button class="tab" onclick="show('natural')">Natural Products</button><button class="tab" onclick="show('reservations')">Reservations</button><button class="tab" onclick="show('reviews')">Reviews</button><button class="tab" onclick="show('payments')">Payment Methods</button><button class="tab" onclick="show('settings')">Settings</button>
</div><div id="app"></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const sb=supabase.createClient("https://nqwsowkcazkfpqmwmsqw.supabase.co","YOUR_NEW_PUBLISHABLE_KEY");
const tabs=["dashboard","orders","products","categories","countries","bundles","natural","reservations","reviews","payments","settings"];
function show(t){document.getElementById("app").innerHTML=`<div class="panel"><h2>${t[0].toUpperCase()+t.slice(1)}</h2><p>This tab is connected to Supabase. Use the forms below to manage ${t}.</p></div><div class="panel"><div class="grid"><div class="field"><label>Name / Title</label><input id="name"></div><div class="field"><label>Phone / Contact</label><input id="phone"></div><div class="field"><label>Quantity / Value</label><input id="qty" type="number"></div><div class="field"><label>Country / Category</label><input id="group"></div><div class="field"><label>Price / Amount</label><input id="price" type="number" step=".01"></div><div class="field"><label>Status</label><select id="status"><option>active</option><option>inactive</option><option>pending</option><option>approved</option><option>completed</option></select></div></div><br><button class="btn" onclick="save('${t}')">Save</button></div><div class="panel"><button class="btn" onclick="loadTable('${t}')">Refresh list</button><div id="table"></div></div>`}
async function save(t){let n=document.getElementById("name").value.trim();if(!n)return alert("Name is required");let map={categories:"categories",countries:"countries",bundles:"bundles",products:"products",reviews:"reviews",payments:"payment_methods",reservations:"reservations"};let table=map[t];if(!table)return alert("Use Orders/Dashboard/Settings for their dedicated controls.");let row={name_en:n,active:document.getElementById("status").value==="active"};if(t==="products")row.retail_price=Number(price.value||0),row.stock_quantity=Number(qty.value||0),row.category_id=group.value; if(t==="bundles")row.price=Number(price.value||0); if(t==="countries")row.name=n; if(t==="categories")row.name_en=n; if(t==="reviews")row.customer_name=n,row.comment=""; let r=await sb.from(table).insert(row);if(r.error)alert(r.error.message);else alert("Saved")}
async function loadTable(t){let map={categories:"categories",countries:"countries",bundles:"bundles",products:"products",reviews:"reviews",reservations:"reservations",payments:"payment_methods"};let table=map[t];if(!table)return;let r=await sb.from(table).select("*").limit(100);if(r.error)return alert(r.error.message);document.getElementById("table").innerHTML="<table class='table'><tr><th>ID</th><th>Name</th><th>Status</th></tr>"+r.data.map(x=>`<tr><td>${x.id}</td><td>${x.name_en||x.name||x.customer_name||""}</td><td>${x.active??x.status??x.approved??""}</td></tr>`).join("")+"</table>"}
show("dashboard");
</script></body></html>
